<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>SOS Thailand - ออฟไลน์</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 24rem;
      width: 100%;
      text-align: center;
    }
    .icon-circle {
      width: 5rem;
      height: 5rem;
      border-radius: 50%;
      background: rgba(234, 179, 8, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon-circle svg {
      width: 2.5rem;
      height: 2.5rem;
      color: #eab308;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .call-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 1rem;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 9999px;
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 1rem;
      box-shadow: 0 0 40px rgba(220, 38, 38, 0.3);
      transition: background 0.2s;
    }
    .call-btn:active { background: #b91c1c; transform: scale(0.98); }
    .call-btn svg { width: 1.25rem; height: 1.25rem; }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9999px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:hover { color: white; border-color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-circle">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M8.172 16.828a5 5 0 010-7.07M15.828 7.172a5 5 0 010 7.07M12 12h.01"/>
      </svg>
    </div>
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>
      กรุณาตรวจสอบสัญญาณ Wi-Fi หรือข้อมูลมือถือ<br>
      หากเป็นเหตุฉุกเฉินเร่งด่วน สามารถโทรได้ทันที
    </p>

    <a href="tel:1669" class="call-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
      </svg>
      โทร 1669 (ฉุกเฉิน)
    </a>

    <button class="retry-btn" onclick="window.location.reload()">
      ลองเชื่อมต่อใหม่
    </button>
  </div>
</body>
</html>
